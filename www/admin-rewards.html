<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Concert Rewards Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0e0f12; --card:#15161a; --line:rgba(255,255,255,.08); --text:#ececec; --muted:rgba(255,255,255,.55); --accent:#ff7f50; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 Montserrat, system-ui, sans-serif; }
    .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
    h1 { font-size:22px; margin:0; color:#fff; }
    h2 { font-size:16px; margin:0 0 12px; color:#fff; }
    .muted { color:var(--muted); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:0 0 16px; }
    .login { max-width:360px; margin:12vh auto 0; text-align:center; }
    .login h1 { margin-bottom:4px; }
    input, select, textarea { width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.14); background:#0b0b0e; color:#fff; font:inherit; }
    input:focus, select:focus { outline:none; border-color:var(--accent); }
    label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:0 0 4px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 16px; border:none; border-radius:10px; background:var(--accent); color:#fff; font:700 13px Montserrat, system-ui, sans-serif; cursor:pointer; text-decoration:none; white-space:nowrap; }
    .btn.ghost { background:transparent; border:1px solid rgba(255,255,255,.18); color:var(--text); }
    .btn.small { padding:6px 10px; font-size:12px; }
    .btn.good { background:rgba(74,222,128,.15); color:var(--good); border:1px solid rgba(74,222,128,.4); }
    .btn.bad { background:rgba(248,113,113,.12); color:var(--bad); border:1px solid rgba(248,113,113,.35); }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    .login .btn { width:100%; margin-top:10px; }
    .err { color:var(--bad); min-height:20px; margin:10px 0 0; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .tabs { display:flex; gap:6px; overflow-x:auto; margin:0 0 16px; padding-bottom:2px; }
    .tabs button { flex-shrink:0; padding:9px 14px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--muted); font:600 13px Montserrat, system-ui, sans-serif; cursor:pointer; }
    .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
    .count { display:inline-block; min-width:18px; padding:0 5px; margin-left:4px; border-radius:9px; background:#ff3b3b; color:#fff; font-size:11px; }
    .grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); align-items:end; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:9px 8px; border-top:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; border-top:none; }
    td.num, th.num { text-align:right; white-space:nowrap; }
    .pill { display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:999px; }
    .pill.pending { color:var(--warn); background:rgba(251,191,36,.12); }
    .pill.sent { color:var(--good); background:rgba(74,222,128,.12); }
    .pill.rejected { color:var(--bad); background:rgba(248,113,113,.12); }
    .pill.live { color:#fff; background:#ff3b3b; }
    .over { color:var(--bad); font-weight:700; }
    .stats { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); margin-bottom:16px; }
    .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
    .stat b { display:block; font-size:20px; color:#fff; }
    .stat span { font-size:12px; color:var(--muted); }
    .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
    .note { font-size:12px; color:var(--muted); margin:8px 0 0; }
    .split { font-size:12.5px; color:var(--muted); margin-top:8px; }
    .seg { display:flex; gap:6px; margin-bottom:12px; }
    .achips { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px; }
    .achips:empty { display:none; }
    .achip { display:inline-flex; align-items:center; gap:4px; padding:5px 4px 5px 12px; border-radius:999px; background:rgba(255,127,80,.15); border:1px solid rgba(255,127,80,.5); color:#fff; font-size:13px; font-weight:600; }
    .achip button { background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; line-height:1; padding:0 6px; border-radius:999px; }
    .achip button:hover, .achip button:focus-visible { color:#fff; }
    .payto { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:6px; font-size:12.5px; }
    .addrow { display:flex; gap:8px; }
    .addrow input { flex:1; min-width:0; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <div id="loginView" class="wrap">
    <div class="card login">
      <h1>Asteroid admin</h1>
      <p class="muted">Concerts, tips and fan rewards</p>
      <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
      <button id="loginBtn" class="btn" type="button">Sign in</button>
      <p id="loginErr" class="err"></p>
    </div>
  </div>

  <div id="appView" class="wrap" hidden>
    <header class="top">
      <h1>Concerts and rewards</h1>
      <button id="signOutBtn" class="btn ghost small" type="button">Sign out</button>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <main id="main"></main>
  </div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-database.js";
    import { initializeAuth, getAuth, browserLocalPersistence, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import {
      FIREBASE_CONFIG, readConfig, rewardsKey, computeRewards, listShows, splitCents, tipPoints,
      centsToUsd, ptsToUsd, fmtPts, esc, ADMIN_EMAIL, POINTS_PER_USD, REDEEM_LABELS, ROOMS, GIFT_CARDS,
      cleanArtistList, artistsLabel, safeTipLink, MAX_SHOW_ARTISTS,
    } from "./js/concert-rewards-core.js";

    // The admin signs in on its own Firebase app instance, so signing in or out
    // here never switches or signs out the fan account the site and app use.
    const ADMIN_APP = "asteroid-admin";
    const app = getApps().find((a) => a.name === ADMIN_APP) || initializeApp(FIREBASE_CONFIG, ADMIN_APP);
    const db = getDatabase(app);
    let auth;
    try { auth = initializeAuth(app, { persistence: browserLocalPersistence }); } catch (e) { auth = getAuth(app); }

    const TZS = [
      ["America/New_York", "US Eastern"], ["America/Chicago", "US Central"], ["America/Denver", "US Mountain"],
      ["America/Los_Angeles", "US Pacific"], ["Asia/Bangkok", "Bangkok"],
    ];
    const S = {
      cfgRaw: null, cfg: readConfig(null), schedule: null, rewards: {}, survey: {}, orders: {}, optins: {}, shouts: {},
      tab: "requests", reqFilter: "pending",
      tz: localStorage.getItem("astAdminTz") || "America/New_York",
      started: false,
      draft: null, editShowId: "",                 // add / edit show form
      artistDraft: null, editArtistId: "",         // add / edit artist form
    };
    const $ = (sel, root = document) => root.querySelector(sel);

    // ---------- Auth ----------
    async function login() {
      const pw = $("#pw").value;
      const btn = $("#loginBtn");
      $("#loginErr").textContent = "";
      if (!pw) return;
      btn.disabled = true; btn.textContent = "Signing in…";
      try {
        await signInWithEmailAndPassword(auth, ADMIN_EMAIL, pw);
      } catch (e) {
        $("#loginErr").textContent = "Wrong password.";
      }
      btn.disabled = false; btn.textContent = "Sign in";
    }
    $("#loginBtn").addEventListener("click", login);
    $("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
    $("#signOutBtn").addEventListener("click", () => signOut(auth).then(() => location.reload()));

    onAuthStateChanged(auth, (u) => {
      const ok = !!(u && u.email && u.email.toLowerCase() === ADMIN_EMAIL);
      $("#loginView").hidden = ok;
      $("#appView").hidden = !ok;
      if (ok) start();
    });

    function start() {
      if (S.started) return;
      S.started = true;
      const fail = (what) => (e) => console.warn("[admin] " + what, e && e.code);
      onValue(ref(db, "CONCERT_CONFIG"), (s) => { S.cfgRaw = s.val() || {}; S.cfg = readConfig(S.cfgRaw); render(); }, fail("config"));
      onValue(ref(db, "CONCERT_SCHEDULE"), (s) => { S.schedule = s.val(); render(); }, fail("schedule"));
      onValue(ref(db, "REWARDS"), (s) => { S.rewards = s.val() || {}; render(); }, fail("rewards"));
      onValue(ref(db, "FAN_SURVEY"), (s) => { S.survey = s.val() || {}; render(); }, fail("survey"));
      onValue(ref(db, "STRIPE_ORDERS"), (s) => { S.orders = s.val() || {}; render(); }, fail("orders"));
      onValue(ref(db, "FAN_OPTIN"), (s) => { S.optins = s.val() || {}; render(); }, fail("optins"));
      onValue(ref(db, "CONCERT_SHOUTOUTS"), (s) => { S.shouts = s.val() || {}; render(); }, fail("shoutouts"));
      render();
    }

    // ---------- Helpers ----------
    function tzParts(ms, tz) {
      const parts = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).formatToParts(new Date(ms));
      const o = {};
      for (const p of parts) o[p.type] = Number(p.value);
      return { y: o.year, m: o.month, d: o.day, h: o.hour % 24, min: o.minute };
    }
    function zonedToUtc(dateStr, timeStr, tz) {
      const [y, m, d] = dateStr.split("-").map(Number);
      const [hh, mm] = timeStr.split(":").map(Number);
      const target = Date.UTC(y, m - 1, d, hh, mm);
      let guess = target;
      for (let i = 0; i < 3; i++) {
        const p = tzParts(guess, tz);
        guess += target - Date.UTC(p.y, p.m - 1, p.d, p.h, p.min);
      }
      return guess;
    }
    function fmtTz(ms, tz = S.tz) {
      return new Date(ms).toLocaleString("en-US", { timeZone: tz, weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }
    function fmtDate(ms) {
      return ms ? new Date(ms).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
    }
    function downloadCsv(filename, header, rows) {
      const q = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
      const lines = [header.map(q).join(",")].concat(rows.map((r) => r.map(q).join(",")));
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
      a.download = filename;
      a.click();
    }
    function tzLabel(tz) { const t = TZS.find(([k]) => k === tz); return t ? t[1] : tz; }
    function slug(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 60) || "artist"; }
    function artistNames() {
      const seen = new Map();
      const add = (n) => { const k = String(n || "").trim(); if (k && !seen.has(k.toLowerCase())) seen.set(k.toLowerCase(), k); };
      for (const a of Object.values(S.cfg.artists || {})) if (a) add(a.name);
      for (const s of listShows(S.schedule)) s.artists.forEach(add);
      return [...seen.values()].sort((a, b) => a.localeCompare(b));
    }
    /** Label saved in the show's "artist" field (older app versions show it). Max 80 characters. */
    function showLabel(artists) {
      const full = artistsLabel(artists);
      if (full.length <= 80) return full;
      const short = artists[0] + " & " + (artists.length - 1) + " more";
      return short.length <= 80 ? short : full.slice(0, 80);
    }
    function datalist(id) {
      return '<datalist id="' + id + '">' + artistNames().map((n) => '<option value="' + esc(n) + '">').join("") + "</datalist>";
    }

    /** One entry per fan key with computed balance. */
    function fans() {
      const R = S.rewards || {};
      const parts = ["attendance", "tips", "adjust", "redemptions"];
      const keys = new Set();
      for (const p of parts) for (const k of Object.keys(R[p] || {})) keys.add(k);
      const out = new Map();
      for (const k of keys) {
        const data = { schedule: S.schedule };
        for (const p of parts) data[p] = (R[p] || {})[k] || null;
        let email = "";
        for (const p of ["redemptions", "tips", "adjust"]) {
          for (const v of Object.values(data[p] || {})) if (!email && v && v.email) email = v.email;
        }
        out.set(k, { key: k, email: email || k, data, r: computeRewards(data, S.cfg) });
      }
      return out;
    }
    function allRedemptions() {
      const list = [];
      for (const [uk, reqs] of Object.entries((S.rewards || {}).redemptions || {})) {
        for (const [id, v] of Object.entries(reqs || {})) if (v) list.push({ uk, id, ...v });
      }
      return list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    }
    /** Where an approved points shoutout goes on screen: {room, showId} or null. */
    function shoutoutTarget(q) {
      const now = Date.now();
      const live = listShows(S.schedule).filter((s) => s.startsAt <= now && now <= s.endsAt);
      const asked = /^Room[1-5]$/.test(String(q.room || "")) ? q.room : "";
      const art = String(q.artist || "").trim().toLowerCase();
      let show = asked ? live.find((s) => s.room === asked) || null : null;
      if (!show && art) show = live.find((s) => s.artists.some((n) => n.toLowerCase() === art)) || null;
      const room = show ? show.room : asked;
      return room ? { room, showId: show ? show.id : "" } : null;
    }
    function allTips() {
      const list = [];
      for (const [uk, tips] of Object.entries((S.rewards || {}).tips || {})) {
        for (const [id, v] of Object.entries(tips || {})) if (v) list.push({ uk, id, ...v });
      }
      return list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    }

    // ---------- Render ----------
    // ---------- Artist payout contacts (private: REWARDS/contacts, admin only) ----------
    const PAY_METHODS = ["PayPal", "Wise", "Venmo", "Cash App", "Zelle", "Bank transfer", "PromptPay", "Other"];
    function contactList() {
      return Object.entries((S.rewards || {}).contacts || {}).map(([id, c]) => ({ id, ...(c || {}) }))
        .filter((c) => c.name).sort((a, b) => String(a.name).localeCompare(String(b.name)));
    }
    function contactFor(name) {
      const n = String(name || "").trim().toLowerCase();
      return n ? contactList().find((c) => String(c.name).trim().toLowerCase() === n) || null : null;
    }
    /** PayPal.me or Cash App link with the amount filled in, from the contact or the artist's tip link. */
    function payLink(name, cents) {
      const c = contactFor(name);
      const cfgArtist = Object.values(S.cfg.artists || {}).find((a) => a && String(a.name || "").toLowerCase() === String(name || "").toLowerCase());
      const amt = cents > 0 ? (cents / 100).toFixed(2) : "";
      for (const raw of [c && c.handle, cfgArtist && cfgArtist.tipLink]) {
        const s = String(raw || "").trim();
        if (!s) continue;
        let u;
        try { u = new URL(/^https:\/\//i.test(s) ? s : "https://" + s.replace(/^\/+/, "")); } catch (e) { continue; }
        const host = u.hostname.toLowerCase().replace(/^www\./, "");
        const first = u.pathname.split("/").filter(Boolean)[0] || "";
        if (host === "paypal.me" && /^[A-Za-z0-9._-]{1,60}$/.test(first)) return "https://paypal.me/" + first + (amt ? "/" + amt + "USD" : "");
        if (host === "cash.app" && /^\$[A-Za-z0-9_-]{1,40}$/.test(first)) return "https://cash.app/" + first + (amt ? "/" + amt : "");
      }
      return "";
    }
    /** One line under a payout: who to pay and how, with Copy and Pay buttons. */
    function payToHtml(name, cents) {
      const n = String(name || "").trim();
      if (!n) return "";
      const c = contactFor(n);
      const link = payLink(n, cents);
      const pay = link ? '<a class="btn small ghost" href="' + esc(link) + '" target="_blank" rel="noopener">Pay' + (cents > 0 ? " " + centsToUsd(cents) : "") + "</a>" : "";
      if (!c) return '<span class="muted">No payout contact for ' + esc(n) + "</span> " + pay +
        '<button type="button" class="btn small ghost" data-add-contact="' + esc(n) + '">Add contact</button>';
      const shown = c.email || c.handle || "";
      return '<span class="muted">' + esc(c.method || "") + "</span> " + esc(shown) + " " +
        (c.email ? '<button type="button" class="btn small ghost" data-copy="' + esc(c.email) + '">Copy email</button>' : "") +
        (!c.email && c.handle ? '<button type="button" class="btn small ghost" data-copy="' + esc(c.handle) + '">Copy</button>' : "") + pay;
    }
    async function copyText(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
        if (btn) { const t = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = t; }, 1500); }
      } catch (e) { prompt("Copy this:", text); }
    }
    // Copy and Add contact buttons work on every tab
    document.addEventListener("click", (e) => {
      const cp = e.target.closest("[data-copy]");
      if (cp) { copyText(cp.dataset.copy, cp); return; }
      const add = e.target.closest("[data-add-contact]");
      if (add) {
        S.tab = "payouts";
        S.contactDraft = { id: "", name: add.dataset.addContact, email: "", method: "PayPal", handle: "", note: "" };
        render();
        const f = document.getElementById("f_cemail");
        if (f) f.focus();
      }
    });

    const TABS = [["requests", "Requests"], ["shows", "Shows"], ["tips", "Tips"], ["money", "Money"], ["payouts", "Payouts"], ["fans", "Fans"], ["settings", "Settings"]];
    function render() {
      if (!S.started) return;
      const pending = allRedemptions().filter((r) => r.status === "pending").length;
      $("#tabs").innerHTML = TABS.map(([k, label]) =>
        '<button type="button" data-tab="' + k + '"' + (S.tab === k ? ' class="on"' : "") + ">" + label +
        (k === "requests" && pending ? '<span class="count">' + pending + "</span>" : "") + "</button>").join("");
      $("#tabs").querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { S.tab = b.dataset.tab; render(); }));
      const focused = document.activeElement && document.activeElement.id;
      if (focused && /^f_/.test(focused)) return; // don't wipe a form while typing
      ({ requests: renderRequests, shows: renderShows, tips: renderTips, money: renderMoney, payouts: renderPayouts, fans: renderFans, settings: renderSettings })[S.tab]();
    }

    function renderRequests() {
      const F = fans();
      const rows = allRedemptions().filter((r) => S.reqFilter === "all" || r.status === "pending");
      $("#main").innerHTML =
        '<div class="card"><div class="seg">' +
        '<button type="button" class="btn small ' + (S.reqFilter === "pending" ? "" : "ghost") + '" data-filter="pending">Pending</button>' +
        '<button type="button" class="btn small ' + (S.reqFilter === "all" ? "" : "ghost") + '" data-filter="all">All</button></div>' +
        (rows.length ? '<div class="table-wrap"><table><thead><tr><th>When</th><th>Fan</th><th>Request</th><th class="num">Points</th><th class="num">Fan balance</th><th>Status</th><th></th></tr></thead><tbody>' +
          rows.map((q) => {
            const f = F.get(q.uk);
            const bal = f ? f.r.balance : 0;
            const target = q.type === "shoutout" && q.status === "pending" ? shoutoutTarget(q) : null;
            const what = esc(REDEEM_LABELS[q.type] || q.type) +
              (q.type === "giftcard" ? ": <b>" + esc(q.card || "") + " " + esc(q.detail || "") + "</b>" : "") +
              (q.type === "tip" ? ": <b>" + esc(q.detail || "") + "</b> gets " + ptsToUsd(q.points) +
                (q.status === "pending" ? '<div class="payto">' + payToHtml(q.detail || q.artist, Math.round(((Number(q.points) || 0) / POINTS_PER_USD) * 100)) + "</div>" : "") : "") +
              (q.type === "shoutout" ? (q.artist ? " for <b>" + esc(q.artist) + "</b>" : "") + ': "' + esc(q.detail || "") + '"' +
                (q.status === "pending" ? '<br><span class="muted">' + (target ? "Shows on screen in " + esc(target.room.replace("Room", "Room ")) : "No live room right now, so it won't show on screen") + "</span>" : "") : "");
            const act = q.status === "pending"
              ? '<div class="row-actions">' +
                (q.type === "giftcard" ? '<a class="btn small ghost" href="https://www.bitrefill.com/us/en/gift-cards/" target="_blank" rel="noopener">Bitrefill</a>' : "") +
                '<button type="button" class="btn small good" data-done="' + esc(q.uk) + "|" + esc(q.id) + '">' + (target ? "Approve and show" : "Mark done") + "</button>" +
                '<button type="button" class="btn small bad" data-reject="' + esc(q.uk) + "|" + esc(q.id) + '">Reject</button></div>'
              : q.status === "sent" ? '<button type="button" class="btn small ghost" data-undo="' + esc(q.uk) + "|" + esc(q.id) + '">Undo</button>' : "";
            return "<tr><td>" + esc(fmtDate(q.ts)) + "</td><td>" + esc(q.email || q.uk) + "</td><td>" + what + '</td><td class="num">' + fmtPts(q.points) +
              '</td><td class="num' + (bal < 0 ? " over" : "") + '">' + (bal < 0 ? "Over by " + fmtPts(-bal) : fmtPts(bal)) +
              '</td><td><span class="pill ' + esc(q.status) + '">' + esc(q.status) + "</span></td><td>" + act + "</td></tr>";
          }).join("") + "</tbody></table></div>"

        '<p class="note">Gift cards: buy the card on Bitrefill, email the code to the fan, then Mark done. Shoutouts: Approve and show puts the message on screen in the live room. Tips with points: pay the artist from the rewards pool. "Over" means the fan spent more than they earned, so reject or check first. Rejecting returns the points.</p></div>';
      $("#main").querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => { S.reqFilter = b.dataset.filter; render(); }));
      $("#main").querySelectorAll("[data-done],[data-reject]").forEach((b) => b.addEventListener("click", async () => {
        const [uk, id] = (b.dataset.done || b.dataset.reject).split("|");
        const status = b.dataset.done ? "sent" : "rejected";
        if (status === "rejected" && !confirm("Reject this request and return the points?")) return;
        b.disabled = true;
        const now = Date.now();
        const base = "REWARDS/redemptions/" + uk + "/" + id;
        const updates = { [base + "/status"]: status, [base + "/doneAt"]: now };
        const q = allRedemptions().find((r) => r.uk === uk && r.id === id);
        const target = status === "sent" && q && q.type === "shoutout" ? shoutoutTarget(q) : null;
        if (target) {
          // Pops up in the room like a paid shoutout (see js/concert-rewards.js)
          updates["CONCERT_SHOUTOUTS/" + target.room + "/pts_" + id] = {
            ts: now, name: String(q.name || "A fan").slice(0, 40), perk: "Shoutout",
            message: String(q.detail || "").slice(0, 140), artist: String(q.artist || "").slice(0, 80),
            showId: target.showId, source: "points",
          };
        }
        try { await update(ref(db), updates); }
        catch (e) { alert("Update failed: " + (e && e.code)); b.disabled = false; }
      }));
      bindUndo();
    }

        if (tipRaw && !tipLink) { alert("The tip link must be a PayPal, Ko-fi, Cash App, Venmo, Buy Me a Coffee or Patreon link starting with https://"); return; }

    function renderMoney() {
      const cfg = S.cfg;
      const by = new Map();
      const get = (name) => {
        const k = String(name || "Unknown").trim() || "Unknown";
        if (!by.has(k)) by.set(k, { name: k, gross: 0, share: 0, ptsSent: 0, ptsPending: 0 });
        return by.get(k);
      };
      let gross = 0, poolIn = 0, asteroid = 0;
      for (const t of allTips()) {
        const sp = splitCents(t.amountCents, cfg);
        const a = get(t.artist);
        a.gross += Number(t.amountCents) || 0;
        a.share += sp.artist;
        gross += Number(t.amountCents) || 0;
        poolIn += sp.rewards;
        asteroid += sp.asteroid;
      }
      let poolOut = 0, cardsSent = 0;
      const payouts = [];
      for (const q of allRedemptions()) {
        const cents = Math.round(((Number(q.points) || 0) / POINTS_PER_USD) * 100);
        if (q.type === "tip") {
          const a = get(q.detail);
          if (q.status === "sent") { a.ptsSent += cents; poolOut += cents; payouts.push({ ...q, cents }); }
          if (q.status === "pending") a.ptsPending += cents;
        }
        if (q.type === "giftcard" && q.status === "sent") { poolOut += cents; cardsSent += cents; payouts.push({ ...q, cents }); }
      }
      const topups = Object.entries((S.rewards || {}).pool || {}).map(([id, v]) => ({ id, ...(v || {}) }))
        .filter((t) => Number(t.cents) > 0).sort((a, b) => (b.ts || 0) - (a.ts || 0));
      const topupCents = topups.reduce((n, t) => n + Math.round(Number(t.cents) || 0), 0);
      const poolLeft = poolIn + topupCents - poolOut;
      let liability = 0;
      for (const f of fans().values()) liability += Math.max(0, f.r.balance);
      const rows = [...by.values()].sort((a, b) => (b.share + b.ptsSent) - (a.share + a.ptsSent));
      const what = (q) => q.type === "giftcard" ? esc((q.card || "Gift card") + " " + (q.detail || "")) : "Points tip to " + esc(q.detail || q.artist || "");
      $("#main").innerHTML =
        '<div class="stats">' +
        '<div class="stat"><b>' + centsToUsd(gross) + "</b><span>Cash tips credited</span></div>" +
        '<div class="stat"><b>' + centsToUsd(gross - poolIn - asteroid) + "</b><span>Artists' " + cfg.artistSharePct + "%</span></div>" +

    /** Undo a fulfilled request: it counts as returned, the fan gets the points back. */
    function bindUndo() {
      $("#main").querySelectorAll("[data-undo]").forEach((b) => b.addEventListener("click", async () => {
        if (!confirm("Undo this? It's marked returned and the fan gets the points back.")) return;
        const [uk, id] = b.dataset.undo.split("|");
        b.disabled = true;
        try { await update(ref(db, "REWARDS/redemptions/" + uk + "/" + id), { status: "rejected", undoneAt: Date.now() }); }
        catch (e) { alert("Update failed: " + (e && e.code)); b.disabled = false; }
      }));
    }

    /** Every artist name we know: shows, the artist list, tips, point tips, perk orders. */
    function payoutArtistNames() {
      const seen = new Map();
      const add = (n) => { const k = String(n || "").trim(); if (k && k !== "Unknown" && !seen.has(k.toLowerCase())) seen.set(k.toLowerCase(), k); };
      artistNames().forEach(add);
      for (const t of allTips()) add(t.artist);
      for (const q of allRedemptions()) if (q.type === "tip") add(q.detail || q.artist);
      for (const o of Object.values(S.orders || {})) if (o) add(o.artist);
      return [...seen.values()].sort((a, b) => a.localeCompare(b));
    }

    function renderFans() {

      const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 15);

        if (a + r + s !== 100) { alert("Artist + rewards + Asteroid must add up to 100."); return; }
        const patch = {
          pointsPerDollar: num("pointsPerDollar"), pointsPerShow: num("pointsPerShow"), attendMinutes: num("attendMinutes"),
          streakDays: Math.max(1, num("streakDays")), streakBonusPoints: num("streakBonusPoints"), minGiftCardUsd: Math.max(1, num("minGiftCardUsd")),
          artistSharePct: a, rewardsSharePct: r, asteroidSharePct: s, viewerCountThreshold: num("viewerCountThreshold"),
          costs: { shoutout: num("cost_shoutout"), badge: num("cost_badge"), early: num("cost_early"), minTip: Math.max(1, num("cost_minTip")) },
          instagram: $("#f_instagram").value.trim(),
          tipLink: $("#f_tipLink").value.trim(),
          perks: [0, 1, 2, 3].map((i) => ({
            name: $("#f_perkName" + i).value.trim().slice(0, 40),
            price: Math.round((Number($("#f_perkPrice" + i).value) || 0) * 100) / 100,
            url: $("#f_perkUrl" + i).value.trim(),
          })).filter((pk) => pk.name || pk.url),
        };
        for (const pk of patch.perks) {
          if (!pk.name || !(pk.price > 0) || !/^https:\/\/\S+$/.test(pk.url)) { alert("Each perk needs a name, a price and a link starting with https://"); return; }
        }
        if (patch.tipLink && !/^https:\/\/\S+$/.test(patch.tipLink)) { alert("Tip link must start with https://"); return; }
        try { await update(ref(db, "CONCERT_CONFIG"), patch); $("#cfgMsg").textContent = "Saved."; document.activeElement && document.activeElement.blur(); }
        catch (e) { alert("Couldn't save: " + (e && e.code)); }
      });
    }
  </script>
</body>
</html>
