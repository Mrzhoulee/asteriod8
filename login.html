<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 28px 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 127, 80, 0.35);
      background: linear-gradient(165deg, #121212 0%, #0a0a0a 100%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 600;
    }
    p.sub {
      margin: 0 0 22px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.75);
    }
    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
    }
    input::placeholder { color: rgba(255, 255, 255, 0.35); }
    button[type="submit"] {
      width: 100%;
      margin-top: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      background: linear-gradient(135deg, #ff7f50, #e85d2c);
      color: #fff;
    }
    button[type="submit"]:hover { filter: brightness(1.06); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
    .err {
      min-height: 20px;
      margin-top: 12px;
      font-size: 13px;
      color: #ff6b6b;
      text-align: center;
    }
    .ok {
      min-height: 20px;
      margin-top: 12px;
      font-size: 13px;
      color: #6bd49b;
      text-align: center;
    }
    .back-row {
      margin: 0 0 18px;
      text-align: left;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 127, 80, 0.95);
      text-decoration: none;
      font-family: inherit;
    }
    .back-link:hover { color: #ffa07a; }
    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      font-size: 13px;
    }
    .link-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: 13px;
      color: rgba(255, 127, 80, 0.95);
      cursor: pointer;
      text-decoration: none;
    }
    .link-btn:hover { color: #ffa07a; text-decoration: underline; }
    .notice {
      margin: 0 0 18px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.45;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.65);
    }
    .hidden { display: none !important; }
    .oauth { margin: 0 0 6px; }
    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 14px;
      margin: 0 0 10px;
      border-radius: 12px;
      border: 1px solid #dadce0;
      background: #fff;
      color: #111;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .oauth-btn:disabled { opacity: .6; cursor: default; }
    .oauth-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .or {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.12); }
  </style>
</head>
<body>
  <div class="card">
    <div class="back-row">
      <a class="back-link" href="index.html"> Back to home</a>
    </div>

    <h1 id="formTitle">Sign in</h1>
    <p class="sub" id="formSub">Continue with Apple, Google or your email.</p>

    <!-- Apple / Google (Google is hidden inside the iOS app, where it can't finish) -->
    <div id="oauthBox" class="oauth">
      <button type="button" class="oauth-btn" id="appleBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M16.37 12.62c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.71-3.19-1.73-1.36-.14-2.65.8-3.34.8-.69 0-1.75-.78-2.88-.76-1.48.02-2.85.86-3.61 2.19-1.54 2.67-.39 6.62 1.11 8.79.73 1.06 1.6 2.25 2.75 2.21 1.1-.04 1.52-.71 2.85-.71 1.33 0 1.71.71 2.88.69 1.19-.02 1.94-1.08 2.66-2.15.84-1.23 1.19-2.42 1.21-2.48-.03-.01-2.32-.89-2.34-3.54zM14.18 6.15c.61-.74 1.02-1.76.91-2.78-.88.04-1.94.59-2.57 1.32-.56.65-1.06 1.69-.93 2.69.98.08 1.98-.5 2.59-1.23z"/></svg>
        Continue with Apple
      </button>
      <button type="button" class="oauth-btn" id="googleBtn">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Continue with Google
      </button>
      <div id="oauthErr" class="err" role="alert"></div>
      <div class="or"><span>or use email</span></div>
    </div>

    <!-- Sign in / Create account -->
    <form id="authForm" class="auth-view" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Password">

      <div id="confirmRow" class="hidden">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Confirm password">
      </div>

      <button type="submit" id="authSubmit">Sign In</button>
      <div id="authErr" class="err" role="alert"></div>

      <div class="row-between">
        <button type="button" class="link-btn" id="forgotBtn">Forgot password?</button>
        <button type="button" class="link-btn" id="toggleMode">Create account</button>
      </div>
    </form>

    <!-- Forgot password -->
    <form id="resetForm" class="reset-view hidden" novalidate>
      <label for="resetEmail">Email</label>
      <input type="email" id="resetEmail" name="resetEmail" autocomplete="username" required placeholder="you@example.com">

      <button type="submit" id="resetSubmit">Send reset email</button>
      <div id="resetMsg" class="ok" role="status"></div>
      <div id="resetErr" class="err" role="alert"></div>

      <div class="row-between">
        <button type="button" class="link-btn" id="backToSignIn"> Back to sign in</button>
      </div>
    </form>
  </div>

  <script src="auth.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import {
      initializeAuth, getAuth,
      browserLocalPersistence, browserPopupRedirectResolver,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      sendPasswordResetEmail, updateProfile,
      GoogleAuthProvider, OAuthProvider, signInWithPopup, signInWithCredential
    } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA-6qtVYHfipL_c6g5JzXKXCxMN5WDKU7A",
      authDomain: "asteroid-cdc13.firebaseapp.com",
      databaseURL: "https://asteroid-cdc13-default-rtdb.firebaseio.com",
      projectId: "asteroid-cdc13",
      storageBucket: "asteroid-cdc13.appspot.com",
      messagingSenderId: "793353824502",
      appId: "1:793353824502:web:3ac24821911d14773ba4d7",
      measurementId: "G-GV72TMNNGR"
    };

    const app = initializeApp(firebaseConfig);
    let auth;
    try {
      // The iOS app gets no popup helper: it loads a Google iframe that never finishes inside
      // the app, and Firebase holds every sign-in until it does (the button just stays stuck).
      // The app signs in with tokens (Apple sheet, Google bridge), which need no popups.
      auth = initializeAuth(app, isNativeApp()
        ? { persistence: browserLocalPersistence }
        : { persistence: browserLocalPersistence, popupRedirectResolver: browserPopupRedirectResolver });
    } catch (e) {
      const code = e && e.code ? String(e.code) : "";
      const msg = e && e.message ? String(e.message) : "";
      if (code === "auth/already-initialized" || /already.*initialized/i.test(msg)) {
        auth = getAuth(app);
      } else {
        auth = getAuth(app);
      }
    }

    // ---- redirect helpers ----------------------------------------------------
    function postLoginRedirect() {
      const q = new URLSearchParams(window.location.search);
      const ret = (q.get("return") || "").trim();
      const allow = {
        "index.html": 1, "studio.html": 1, "pat.html": 1, "lively.html": 1,
        "liveroom1.html": 1, "liveroom2.html": 1, "liveroom3.html": 1, "liveroom4.html": 1, "liveroom5.html": 1,
        "pass.html": 1,
      };
      window.location.replace(allow[ret] ? ret : "index.html");
    }

    function sanitizeKey(s) {
      return String(s || "").trim().replace(/[.#$[\]]/g, "_");
    }

    function applySession(user, email) {
      const displayName = (user && user.displayName) ? user.displayName : "";
      const name = displayName || (email.includes("@") ? email.split("@")[0] : email);
      const key = sanitizeKey(email);

      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("userEmail", email);
      localStorage.setItem("email", email);
      localStorage.setItem("CurrentUser", email);
      localStorage.setItem("userName", name);
      localStorage.setItem("fullName", name);
      localStorage.setItem("asteroidSignedInBefore", "true");
      localStorage.setItem("emailKey", key);
      // Important: do NOT set localAuthOnly - this is real Firebase auth.
      localStorage.removeItem("localAuthOnly");
    }

    // If a session is already valid, bounce out immediately. Concert pages (passes, points)
    // need the real Firebase login, so for them only bounce when it is still active: the
    // app can remember someone whose Firebase login ended, and bouncing would loop.
    if (typeof window.isSessionValid === "function" && window.isSessionValid()) {
      const ret = (new URLSearchParams(window.location.search).get("return") || "").trim();
      if (!/^(pass|lively|liveroom[1-5])\.html$/.test(ret)) {
        postLoginRedirect();
      } else if (typeof auth.authStateReady === "function") {
        auth.authStateReady().then(() => { if (auth.currentUser) postLoginRedirect(); }).catch(() => {});
      }
    }

    // ---- error message mapping -----------------------------------------------
    function friendlyError(code) {
      switch (code) {
        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found":
          return "Wrong email or password. Try again, or create an account.";
        case "auth/email-already-in-use":
          return "An account with that email already exists. Try signing in instead.";
        case "auth/weak-password":
          return "Password is too weak. Use at least 6 characters.";
        case "auth/invalid-email":
          return "That email address doesn't look right.";
        case "auth/network-request-failed":
          return "Network problem. Check your connection and try again.";
        case "auth/too-many-requests":
          return "Too many attempts. Please wait a moment, then try again.";
        case "auth/missing-password":
          return "Please enter your password.";
        case "auth/operation-not-allowed":
          return "Email sign-in is not enabled yet. Please contact support.";
        default:
          return "Couldn't complete that. Please try again.";
      }
    }

    // ---- DOM ----------------------------------------------------------------
    const authForm     = document.getElementById("authForm");
    const resetForm    = document.getElementById("resetForm");
    const formTitle    = document.getElementById("formTitle");
    const formSub      = document.getElementById("formSub");
    const emailInput   = document.getElementById("email");
    const passInput    = document.getElementById("password");
    const confirmRow   = document.getElementById("confirmRow");
    const confirmInput = document.getElementById("confirmPassword");
    const submitBtn    = document.getElementById("authSubmit");
    const errEl        = document.getElementById("authErr");
    const toggleBtn    = document.getElementById("toggleMode");
    const forgotBtn    = document.getElementById("forgotBtn");
    const resetEmail   = document.getElementById("resetEmail");
    const resetSubmit  = document.getElementById("resetSubmit");
    const resetMsg     = document.getElementById("resetMsg");
    const resetErr     = document.getElementById("resetErr");
    const backToSignIn = document.getElementById("backToSignIn");
    const oauthBox     = document.getElementById("oauthBox");
    const appleBtn     = document.getElementById("appleBtn");
    const googleBtn    = document.getElementById("googleBtn");
    const oauthErr     = document.getElementById("oauthErr");

    let mode = "signin"; // "signin" | "signup"

    function setMode(next) {
      mode = next;
      const isSignup = mode === "signup";
      formTitle.textContent = isSignup ? "Create account" : "Sign in";
      formSub.textContent   = isSignup
        ? "Continue with Apple or Google, or use your email and a password (at least 6 characters)."
        : "Continue with Apple, Google or your email.";
      submitBtn.textContent = isSignup ? "Create Account" : "Sign In";
      toggleBtn.textContent = isSignup ? "Have an account? Sign in" : "Create account";
      confirmRow.classList.toggle("hidden", !isSignup);
      passInput.setAttribute("autocomplete", isSignup ? "new-password" : "current-password");
      passInput.setAttribute("placeholder", isSignup ? "At least 6 characters" : "Password");
      errEl.textContent = "";
    }

    toggleBtn.addEventListener("click", () => setMode(mode === "signin" ? "signup" : "signin"));

    forgotBtn.addEventListener("click", () => {
      authForm.classList.add("hidden");
      oauthBox.classList.add("hidden");
      resetForm.classList.remove("hidden");
      formTitle.textContent = "Reset password";
      formSub.textContent   = "Enter your email - we'll send a reset link.";
      resetEmail.value      = emailInput.value;
      resetMsg.textContent  = "";
      resetErr.textContent  = "";
    });

    backToSignIn.addEventListener("click", () => {
      resetForm.classList.add("hidden");
      authForm.classList.remove("hidden");
      oauthBox.classList.remove("hidden");
      setMode(mode);
    });

    // ---- submit: sign in / sign up ------------------------------------------
    authForm.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      errEl.textContent = "";

      const email = (emailInput.value || "").trim();
      const password = passInput.value || "";

      if (!email) { errEl.textContent = "Please enter your email."; return; }
      if (!password) { errEl.textContent = "Please enter your password."; return; }

      if (mode === "signup") {
        if (password.length < 6) {
          errEl.textContent = "Password must be at least 6 characters.";
          return;
        }
        if (password !== (confirmInput.value || "")) {
          errEl.textContent = "Passwords don't match.";
          return;
        }
      }

      submitBtn.disabled = true;
      const originalLabel = submitBtn.textContent;
      submitBtn.textContent = mode === "signup" ? "Creating account…" : "Signing in…";

      try {
        let cred;
        if (mode === "signup") {
          cred = await createUserWithEmailAndPassword(auth, email, password);
          // Set a default display name from the email prefix.
          try {
            const prefix = email.includes("@") ? email.split("@")[0] : email;
            if (cred.user && !cred.user.displayName) {
              await updateProfile(cred.user, { displayName: prefix });
            }
          } catch (_) { /* non-fatal */ }
        } else {
          cred = await signInWithEmailAndPassword(auth, email, password);
        }

        applySession(cred.user, email);
        postLoginRedirect();
      } catch (e) {
        const code = (e && e.code) ? String(e.code) : "";
        errEl.textContent = friendlyError(code);
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
      }
    });

    // ---- submit: forgot password --------------------------------------------
    resetForm.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      resetMsg.textContent = "";
      resetErr.textContent = "";

      const email = (resetEmail.value || "").trim();
      if (!email) { resetErr.textContent = "Please enter your email."; return; }

      resetSubmit.disabled = true;
      const originalLabel = resetSubmit.textContent;
      resetSubmit.textContent = "Sending…";

      try {
        await sendPasswordResetEmail(auth, email);
        resetMsg.textContent = "Reset email sent. Check your inbox.";
      } catch (e) {
        const code = (e && e.code) ? String(e.code) : "";
        resetErr.textContent = friendlyError(code);
      } finally {
        resetSubmit.disabled = false;
        resetSubmit.textContent = originalLabel;
      }
    });

    // ---- Continue with Apple / Google ----------------------------------------
    // Web: Firebase popups. iOS app: the native Sign in with Apple sheet, and for Google the
    // bridge page (Google won't sign in inside an app), which sends the tokens back to the app.
    function isNativeApp() {
      try {
        const C = window.Capacitor;
        return !!(C && typeof C.isNativePlatform === "function" && C.isNativePlatform());
      } catch (e) { return false; }
    }
    const GOOGLE_BRIDGE = "https://asteroid-cdc13.firebaseapp.com/google-auth-bridge?return=" + encodeURIComponent("asteroid://google-auth");
    const SIGNIN_TIMEOUT_MS = window.__astSignInTimeoutForTest || 30000;

    /** Apple's own id for this person (Firebase keeps it as the Apple provider uid). */
    function appleUserId(user) {
      const p = ((user && user.providerData) || []).find((x) => x && x.providerId === "apple.com");
      return p && p.uid ? String(p.uid).trim() : "";
    }

    /** Same account keys the home page writes after Apple or Google sign-in. */
    function applyOAuthSession(user, nameHint) {
      const providers = (user && user.providerData) || [];
      const isApple = providers.some((p) => p && p.providerId === "apple.com");
      const email = String(user.email || (providers[0] && providers[0].email) || "").trim();
      let id = isApple ? String(user.uid || email).trim() : String(email || user.uid || "").trim();
      // The iOS app keys Apple accounts by Apple's own id (its Apple sign-in has always saved that),
      // so the profile someone already has in the app stays theirs. A phone on the Firebase id keeps it.
      const prevId = (localStorage.getItem("CurrentUser") || "").trim();
      const appleId = isApple && isNativeApp() ? appleUserId(user) : "";
      if (appleId && prevId !== String(user.uid)) id = appleId;
      // Apple only sends the name the first time: keep the one this phone has for the same account,
      // and never use a hidden Apple relay address as a name
      const kept = prevId === id ? (localStorage.getItem("fullName") || "").trim() : "";
      const fromEmail = email.includes("@") && !/privaterelay\.appleid\.com$/i.test(email) ? email.split("@")[0] : "";
      const name = user.displayName || nameHint || kept || fromEmail;
      ["isLoggedIn", "userEmail", "userName", "localAuthOnly"].forEach((k) => localStorage.removeItem(k));
      localStorage.setItem("asteroidSignedInBefore", "true");
      localStorage.setItem("email", email || id);
      localStorage.setItem("CurrentUser", id);
      localStorage.setItem("emailKey", sanitizeKey(id));
      if (name) { localStorage.setItem("fullName", name); localStorage.setItem("name", name); }
      else if (prevId !== id) { localStorage.removeItem("fullName"); localStorage.removeItem("name"); }
      if (user.photoURL) localStorage.setItem("pfp", user.photoURL);
      // New Apple accounts in the iOS app start as artists (the home page saves it to the profile)
      if (isApple && isNativeApp() && !localStorage.getItem("profileType")) localStorage.setItem("profileType", "artist");
    }

    function oauthMessage(e, who) {
      const code = (e && e.code) ? String(e.code) : "";
      if (code === "auth/account-exists-with-different-credential") {
        return "You already have an account with that email. Sign in with your email and password below.";
      }
      if (code === "auth/popup-blocked") return "Your browser blocked the " + who + " window. Allow pop-ups, or use your email below.";
      if (code === "auth/network-request-failed") return "Network problem. Check your connection and try again.";
      if (code === "app/timeout") return "Signing in with " + who + " is taking too long. Check your connection and try again.";
      return "Couldn't sign in with " + who + ". Try again, or use your email below.";
    }

    /** Short reason after the message, so a failed sign-in can be traced from a screenshot. */
    function errDetail(e) {
      const code = (e && e.code) ? String(e.code) : "";
      if (/^(auth|app|google)\//.test(code)) return code;
      const m = String((e && (e.message || e.errorMessage)) || "").match(/error (\d{3,5})/i);
      return m ? "Apple " + m[1] : "";
    }

    function isCancel(e) {
      const code = (e && e.code) ? String(e.code) : "";
      const msg = String((e && (e.message || e.errorMessage)) || "");
      return code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request" ||
        code === "auth/user-cancelled" || /1001|cancel/i.test(msg);
    }

    function randomHex(bytes) {
      const a = new Uint8Array(bytes);
      crypto.getRandomValues(a);
      return Array.from(a, (b) => ("0" + b.toString(16)).slice(-2)).join("");
    }
    async function sha256Hex(s) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(s)));
      return Array.from(new Uint8Array(buf), (b) => ("0" + b.toString(16)).slice(-2)).join("");
    }

    /** The iOS app's Sign in with Apple sheet, then Firebase (same setup as the home page). */
    async function appleInApp() {
      const C = window.Capacitor;
      const P = (C.Plugins && C.Plugins.SignInWithApple) ||
        (typeof C.nativePromise === "function" ? { authorize: (o) => C.nativePromise("SignInWithApple", "authorize", o || {}) } : null);
      if (!P || typeof P.authorize !== "function") throw Object.assign(new Error("Sign in with Apple isn't available"), { code: "app/no-apple" });
      const rawNonce = randomHex(32);
      const res = await P.authorize({
        clientId: "com.asteroid.asteroidinc8",
        redirectURI: "https://asteroid-cdc13.firebaseapp.com/__/auth/handler",
        scopes: "email name",
        nonce: await sha256Hex(rawNonce),
      });
      const r = (res && res.response) || res || {};
      const idToken = r.identityToken || r.identity_token;
      if (!idToken) throw Object.assign(new Error("No Apple token"), { code: "app/no-token" });
      const cred = new OAuthProvider("apple.com").credential({ idToken: String(idToken), rawNonce });
      const result = await withTimeout(signInWithCredential(auth, cred));
      const nameHint = [r.givenName || r.given_name, r.familyName || r.family_name].filter(Boolean).join(" ").trim();
      if (nameHint && result.user && !result.user.displayName) {
        try { await withTimeout(updateProfile(result.user, { displayName: nameHint }), 8000); } catch (_) { /* non-fatal */ }
      }
      return { user: result.user, nameHint };
    }

    /** Never leave the buttons stuck: a sign-in step that hangs becomes an error after a while. */
    function withTimeout(p, ms) {
      return new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(Object.assign(new Error("timeout"), { code: "app/timeout" })), ms || SIGNIN_TIMEOUT_MS);
        p.then((v) => { clearTimeout(t); resolve(v); }, (e) => { clearTimeout(t); reject(e); });
      });
    }

    /** The iOS app: Google sign-in runs on the bridge page in the in-app browser, which comes
     *  back to asteroid://google-auth with Google's tokens; Firebase signs in with them here. */
    function googleInApp() {
      const P = (window.Capacitor && window.Capacitor.Plugins) || {};
      const Browser = P.Browser;
      const App = P.App;
      if (!Browser || typeof Browser.open !== "function" || !App || typeof App.addListener !== "function") {
        return Promise.reject(Object.assign(new Error("Google sign-in isn't available"), { code: "app/no-browser" }));
      }
      return new Promise((resolve, reject) => {
        let done = false;
        let back = false;   // the bridge came back with an answer
        const handles = [];
        const keep = (h) => Promise.resolve(h).then((x) => { if (done) { try { x && x.remove(); } catch (_) {} } else handles.push(x); }).catch(() => {});
        const finish = (ok, v) => {
          if (done) return;
          done = true;
          handles.forEach((x) => { try { x && x.remove(); } catch (_) {} });
          ok ? resolve(v) : reject(v);
        };
        keep(App.addListener("appUrlOpen", async (e) => {
          const url = String((e && e.url) || "");
          if (!/^asteroid:\/\/google-auth/i.test(url) || done) return;
          back = true;
          try { await Browser.close(); } catch (_) {}
          const q = new URLSearchParams(url.split("?")[1] || "");
          const err = q.get("error");
          if (err) return finish(false, Object.assign(new Error(err), { code: "google/" + err.replace(/^auth\//, "") }));
          const idToken = q.get("idToken") || "";
          if (q.get("ok") !== "1" || !idToken) return finish(false, Object.assign(new Error("No Google token"), { code: "app/no-token" }));
          try {
            const result = await withTimeout(signInWithCredential(auth, GoogleAuthProvider.credential(idToken, q.get("accessToken") || undefined)));
            finish(true, { user: result.user, nameHint: "" });
          } catch (x) { finish(false, x); }
        }));
        // Closed with Done before finishing: give the buttons back quietly
        if (typeof Browser.addListener === "function") {
          keep(Browser.addListener("browserFinished", () => {
            setTimeout(() => { if (!back) finish(false, Object.assign(new Error("closed"), { code: "auth/user-cancelled" })); }, 1200);
          }));
        }
        Promise.resolve(Browser.open({ url: GOOGLE_BRIDGE, presentationStyle: "fullscreen" })).catch((x) => finish(false, x));
      });
    }

    async function oauthSignIn(btn, who, run) {
      oauthErr.textContent = "";
      errEl.textContent = "";
      appleBtn.disabled = googleBtn.disabled = true;
      try {
        const { user, nameHint } = await run();
        applyOAuthSession(user, nameHint);
        postLoginRedirect();
      } catch (e) {
        console.warn("[login] " + who, e && (e.code || e.message));
        if (!isCancel(e)) {
          const d = errDetail(e);
          oauthErr.textContent = oauthMessage(e, who) + (d ? " (" + d + ")" : "");
        }
        appleBtn.disabled = googleBtn.disabled = false;
      }
    }

    appleBtn.addEventListener("click", () => oauthSignIn(appleBtn, "Apple", async () => {
      if (isNativeApp()) return appleInApp();
      const provider = new OAuthProvider("apple.com");
      provider.addScope("email");
      provider.addScope("name");
      const result = await signInWithPopup(auth, provider);
      return { user: result.user, nameHint: "" };
    }));

    googleBtn.addEventListener("click", () => oauthSignIn(googleBtn, "Google", async () => {
      if (isNativeApp()) return googleInApp();
      const provider = new GoogleAuthProvider();
      provider.addScope("email");
      provider.addScope("profile");
      const result = await signInWithPopup(auth, provider);
      return { user: result.user, nameHint: "" };
    }));
  </script>
</body>
</html>
